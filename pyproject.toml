[project]
name = "binder-bench"
version = "0.1.0"
description = "Does structure-prediction interface confidence predict binding for de novo designed binders"
requires-python = ">=3.11,<3.12"

# Every version pinned exactly. Two reasons, per SPEC.md: a stranger
# reproducing the results table needs the same software, and Modal caches
# images by the hash of the definition text, so an unpinned spec hashes
# identically forever while the thing it resolves to drifts.
dependencies = [
    "modal==1.5.5",
    "pandas==2.3.3",
    "pyarrow==21.0.0",
    "numpy==2.2.6",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/binder_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
